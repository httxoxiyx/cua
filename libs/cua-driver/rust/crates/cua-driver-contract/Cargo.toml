[package]
name = "cua-driver-contract"
version.workspace = true
edition.workspace = true
publish = false

[[bin]]
name = "cua-contract-gen"
path = "src/bin/cua-contract-gen.rs"

[dependencies]
serde = { workspace = true }
serde_json = { workspace = true }
schemars = "1.2.1"
uniffi = { workspace = true, optional = true }

[features]
# Preserve the existing standalone contract bindings. Native-only consumers
# disable defaults and keep the Rust/Serde/schema contract without UniFFI.
default = ["ffi"]
ffi = ["dep:uniffi"]
